<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2C2C2C"/>
      <stop offset="100%" stop-color="#111111"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Network Mesh Connecting Lines -->
  <g stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="4" stroke-linecap="round">
    <line x1="68" y1="96" x2="188" y2="96"/>
    <line x1="68" y1="96" x2="128" y2="190"/>
    <line x1="188" y1="96" x2="128" y2="190"/>
    <line x1="128" y1="64" x2="68" y2="96"/>
    <line x1="128" y1="64" x2="188" y2="96"/>
    <line x1="128" y1="64" x2="128" y2="190"/>
  </g>

  <!-- Peripheral Tracker Nodes (GitHub, Jira, Launchpad) -->
  <circle cx="68" cy="96" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="188" cy="96" r="16" fill="#FFFFFF" fill-opacity="0.9"/>
  <circle cx="128" cy="190" r="16" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Central Intelligence Node (Canonical Orange) -->
  <circle cx="128" cy="116" r="24" fill="#E95420" filter="url(#glow)"/>
  <circle cx="128" cy="116" r="12" fill="#FFFFFF"/>

  <!-- Top Hub Node -->
  <circle cx="128" cy="64" r="12" fill="#E95420"/>
</svg>
