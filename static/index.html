<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IssueMesh - Engineering Issue Intelligence</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-dot"></span>
            IssueMesh
        </a>
        <nav>
            <a href="/" class="active">Search</a>
            <a href="/intelligence">Intelligence</a>
            <a href="/concepts">Concepts</a>
            <a href="/memory">Memory</a>
            <a href="/sources">Sources</a>
            <a href="/introspection">Introspection</a>
            <a href="/health">Health</a>
            <a href="/tutorial">Tutorial</a>
            <a href="/settings">Settings</a>
        </nav>
        <div id="header-health" class="status-badge">
            <span class="dot dot-healthy"></span>
            <span>Ready</span>
        </div>
    </header>

    <main class="container">
        <section class="search-hero">
            <h1>Search GitHub &middot; Jira &middot; Launchpad</h1>
            <p>Evidence-driven engineering intelligence across your trackers</p>
            <form id="search-form" class="search-box" onsubmit="event.preventDefault(); runSearch();">
                <div class="search-input-wrapper">
                    <input type="text" id="query-input" class="search-input" placeholder="e.g. Why is BGP blocking multi-site OpenStack? or OPEN-4679..." autofocus>
                    <div id="search-progress-bar" class="search-progress-bar" aria-hidden="true">
                        <div class="search-progress-bar-fill"></div>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
            </form>
        </section>

        <section id="search-progress" style="display: none; max-width: 800px; margin: 1.5rem auto 2rem auto;">
            <div class="card search-progress-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <div class="card-title" style="margin: 0; font-size: 1rem; color: var(--color-muted-text); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Search Progress</div>
                    <span id="search-progress-status" class="status-badge" style="color: var(--color-orange); font-size: 0.85rem;">
                        <span class="dot dot-searching"></span> Live
                    </span>
                </div>
                <textarea id="progress-textbox" class="search-progress-textbox" rows="4" readonly placeholder="Waiting for search events..."></textarea>
                <div id="progress-log" style="display: none;"></div>
            </div>
        </section>

        <section id="results-area" style="max-width: 800px; margin: 0 auto;">
            <div id="results-list"></div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
