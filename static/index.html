<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IssueMesh - Engineering Issue Intelligence</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <a href="/" class="brand">
            <span class="brand-dot"></span>
            IssueMesh
        </a>
        <nav>
            <a href="/" class="active">Search</a>
            <a href="/memory">Memory</a>
            <a href="/sources">Sources</a>
            <a href="/health">Health</a>
            <a href="/settings">Settings</a>
        </nav>
        <div id="header-health" class="status-badge">
            <span class="dot dot-healthy"></span>
            <span>Ready</span>
        </div>
    </header>

    <main class="container">
        <section class="search-hero">
            <h1>Search GitHub &middot; Jira &middot; Launchpad</h1>
            <p>Evidence-driven engineering intelligence across your trackers</p>
            <form id="search-form" class="search-box" onsubmit="event.preventDefault(); runSearch();">
                <input type="text" id="query-input" class="search-input" placeholder="e.g. Why is BGP blocking multi-site OpenStack? or OPEN-4679..." autofocus>
                <button type="submit" class="btn btn-primary" id="search-btn">Search</button>
            </form>
        </section>

        <section id="search-progress" style="display: none; max-width: 800px; margin: 0 auto 2rem auto;">
            <div class="card">
                <div class="card-title">Search Progress</div>
                <div id="progress-log" style="font-family: var(--font-mono); font-size: 0.9rem; line-height: 1.8;"></div>
            </div>
        </section>

        <section id="results-area" style="max-width: 800px; margin: 0 auto;">
            <div id="results-list"></div>
        </section>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
