name: issuemesh
base: core24
version: '0.2.8'
summary: Autonomous multi-tracker issue intelligence engine
description: |
  IssueMesh is an autonomous local-first issue intelligence engine that
  federates issues, discussions, tasks, and code reviews across Launchpad,
  GitHub, and Jira with deep graph expansion and hybrid ranking.
grade: stable
confinement: strict
license: MIT

apps:
  issuemesh:
    command: bin/issuemesh-launch
    plugs:
      - network
      - network-bind
      - home

parts:
  issuemesh:
    plugin: rust
    source: .
    build-packages:
      - build-essential
      - pkg-config
    stage-packages:
      - ca-certificates
    override-build: |
      export CFLAGS="-fno-sanitize=undefined -fwrapv"
      craftctl default
      mkdir -p $CRAFT_PART_INSTALL/usr/share/issuemesh/static
      cp -r static/* $CRAFT_PART_INSTALL/usr/share/issuemesh/static/
      mkdir -p $CRAFT_PART_INSTALL/usr/share/issuemesh/schema
      cp -r schema/* $CRAFT_PART_INSTALL/usr/share/issuemesh/schema/
      mkdir -p $CRAFT_PART_INSTALL/bin
      cp snap/local/issuemesh-launch $CRAFT_PART_INSTALL/bin/issuemesh-launch
      chmod +x $CRAFT_PART_INSTALL/bin/issuemesh-launch
